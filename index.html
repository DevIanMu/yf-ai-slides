<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>YF × Gangtise AI 能力接入 · 汇报</title>
<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-cover.html",          label: "封面" },
    { file: "slides/02-why.html",            label: "为什么现在" },
    { file: "slides/03-evidence.html",       label: "实测结论" },
    { file: "slides/04-demo-pager.html",     label: "P0-1 个股一页通卡片" },
    { file: "slides/05-demo-watchlist.html", label: "P0-2 自选股 AI 摘要" },
    { file: "slides/06-demo-alert.html",     label: "P0-3 异动归因" },
    { file: "slides/07-retention.html",      label: "触达渠道 × 留存运营" },
    { file: "slides/08-mapping.html",        label: "触达场景 × 能力映射" },
    { file: "slides/09-cost.html",           label: "成本模型" },
    { file: "slides/10-risks.html",          label: "风险与前置条件" },
    { file: "slides/11-roadmap.html",        label: "落地节奏" },
  ];
  window.DECK_WIDTH = 1920;
  window.DECK_HEIGHT = 1080;
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  #stage {
    position: fixed;
    top: 50%; left: 50%;
    transform-origin: top left;
    will-change: transform;
    background: #fff;
    box-shadow: 0 10px 60px rgba(0,0,0,0.4);
  }
  iframe {
    width: 100%; height: 100%;
    border: 0; display: block; background: #fff;
  }
  .counter {
    position: fixed; bottom: 20px; right: 132px;
    background: rgba(0,0,0,0.65); color: #fff;
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    z-index: 100; user-select: none; opacity: 0.7; transition: opacity 0.2s;
  }
  .counter:hover { opacity: 1; }
  .counter .label { color: rgba(255,255,255,0.7); margin-left: 8px; }
  .deck-nav {
    position: fixed; bottom: 14px; right: 20px;
    display: flex; gap: 10px; z-index: 100;
  }
  .deck-nav button {
    width: 44px; height: 44px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(0,0,0,0.65); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
    opacity: 0.7; transition: opacity 0.2s, background 0.2s;
    user-select: none;
  }
  .deck-nav button:hover { opacity: 1; background: rgba(30,32,38,0.9); }
  .deck-nav button:disabled { opacity: 0.22; cursor: default; }
  .nav-zone {
    position: fixed; top: 0; bottom: 0; width: 15%;
    cursor: pointer; z-index: 50;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 999px;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; opacity: 0; transition: opacity 0.2s;
  }
  .nav-zone.left  .nav-hint { left: 20px; }
  .nav-zone.right .nav-hint { right: 20px; }
  .nav-zone:hover .nav-hint { opacity: 1; }
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #fff; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; }
    .counter, .nav-zone, .deck-nav { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe {
      width: 1920px; height: 1080px;
      page-break-after: always; display: block;
    }
  }
</style>
</head>
<body>

<div id="stage"><iframe id="frame" src="about:blank"></iframe></div>
<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter">1 / 11</div>
<div class="deck-nav">
  <button id="navPrev" aria-label="上一页">‹</button>
  <button id="navNext" aria-label="下一页">›</button>
</div>
<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const navPrev = document.getElementById('navPrev');
  const navNext = document.getElementById('navNext');
  const storageKey = 'deck-index-' + location.pathname;
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0';
    stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = deck[idx].file;
    counter.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''}</span>`;
    navPrev.disabled = idx === 0;
    navNext.disabled = idx === deck.length - 1;
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) {
      history.replaceState(null, '', '#' + (idx + 1));
    }
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P':                             window.print(); break;
      default:
        if (e.key >= '1' && e.key <= '9') {
          const i = parseInt(e.key, 10) - 1;
          if (i < deck.length) { e.preventDefault(); show(i); }
        }
    }
  });

  navPrev.addEventListener('click', prev);
  navNext.addEventListener('click', next);
  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit();
  show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = item.file;
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    document.getElementById('stage').style.display = '';
  });
})();
</script>

</body>
</html>
