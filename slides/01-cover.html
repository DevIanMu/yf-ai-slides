<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · 封面</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body { display: flex; flex-direction: column; justify-content: center; padding: 0 160px; }
  .cover-logo { height: 64px; width: auto; margin-bottom: 120px; align-self: flex-start; }
  .kicker {
    font-size: 18px; font-weight: 600; letter-spacing: 0.22em;
    color: var(--yf-blue); margin-bottom: 32px;
  }
  h1 {
    font-family: var(--f-display);
    font-size: 96px; font-weight: 400; line-height: 1.08; letter-spacing: -2.5px;

  }
  .sub {
    margin-top: 40px; font-size: 28px; color: var(--on-dark-soft); max-width: 1100px;
  }
  .meta {
    margin-top: 120px; display: flex; gap: 64px;
    font-size: 18px; color: var(--on-dark-soft);

  .meta b { color: var(--on-dark); font-weight: 600; }

<body class="dark">
